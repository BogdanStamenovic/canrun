[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canrun-cli"
version = "0.1.0"
description = "Check how well an application will run on this computer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
keywords = ["hardware", "system-requirements", "games", "cli", "gemini"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
canrun = "canrun.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/canrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

